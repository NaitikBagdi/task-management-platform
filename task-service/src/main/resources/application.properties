server.port=${SERVER_PORT:8082}

# Database Connection targeting taskdb schema
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tmp_database}?currentSchema=${DB_SCHEMA:taskdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_actual_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Shared JWT Secret Key (Must be exactly same as Auth Service)
app.jwt.secret=${JWT_SECRET:your_secret_key_minimum_256_bits_length}
app.auth-service.base-url=http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}

spring.jpa.open-in-view=false